<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI kit</title>
    <link rel="icon" href="images/logos/favicon.svg" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <!-- CSS FILES -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <div class="container">
        <div class="mb-5">
            <h1 class="display_1">UI Kit</h1>
            <h2 class="headline_1">Iconos</h2>

            <ion-icon name="heart"></ion-icon> <!--filled-->
            <ion-icon name="heart-outline"></ion-icon> <!--outline-->
            <ion-icon name="heart-sharp"></ion-icon> <!--sharp-->
            <ion-icon name="american-football-outline"></ion-icon>
            <ion-icon name="beer-outline"></ion-icon>
        </div>


        <!-- Buttons -->
        <div class="mb-5">
            <h2 class="headline_1">Botones</h2>

            <button type="button" class="btn primary-btn">
                <ion-icon name="arrow-back"></ion-icon>
                Primary
                <ion-icon name="arrow-forward"></ion-icon>
            </button>

            <button type="button" class="btn primary-btn" disabled>
                <ion-icon name="arrow-back"></ion-icon>
                Primary
                <ion-icon name="arrow-forward"></ion-icon>
            </button>

            <button type="button" class="btn outline-btn">
                <ion-icon name="arrow-back"></ion-icon>
                Outline
                <ion-icon name="arrow-forward"></ion-icon>
            </button>

            <button type="button" class="btn outline-btn" disabled>
                <ion-icon name="arrow-back"></ion-icon>
                Outline
                <ion-icon name="arrow-forward"></ion-icon>
            </button>
            <button type="button" class="btn btn-icon primary-btn-icon">
                <ion-icon name="arrow-back"></ion-icon>
            </button>
            <button type="button" class="btn btn-icon primary-btn-icon" disabled>
                <ion-icon name="arrow-back"></ion-icon>
            </button>
        </div>
        
        <!-- End buttons -->

        <!-- Links -->
        <div class="mb-5">
            <h2 class="headline_2 mb-2">links</h2>

            <a href="#" class="primary-link">
                link primary
            </a>

            <a href="#" class="primary-link disabled-link" disabled>
                link primary disabled
            </a>
        </div>
        <!-- End links -->

        <!-- Inputs -->
        <div class="mb-5">
            <h2 class="headline_2 mb-2">Inputs</h2>

            <form class="form-login">
                    <div class="form-row">
                        <div class="form-group col">
                            <label for="user-doc-type" class="form-label">State</label>
                            <select class="form-select" id="user-doc-type" required="">
                                <option>DNI</option>
                                <option>CE</option>
                                <option>Pasaporte</option>
                            </select>
                        </div>
                        <div class="form-group col">
                            <label for="user-doc-number" class="form-label">Número</label>
                            <input type="text" class="form-control" id="user-doc-number" aria-describedby="emailHelp">
                            <div class="invalid-feedback">
                                Ingreser un número de documento válido.
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="user-password" class="form-label">Contraseña</label>
                        <div class="password-input-wrapper">
                            <input type="password" class="form-control" id="user-password">
                            <ion-icon name="eye-outline" id="toggle-password" class="toggle-password-icon"></ion-icon>
                        </div>
                        <div class="invalid-feedback">
                            Ingrese una contraseña válida.
                        </div>
                    </div>


                    <button type="submit" class="btn primary-btn">Iniciar sesión</button>

                    <a href="#" class="primary-link" data-bs-toggle="modal" data-bs-target="#modalRecoverPassword">
                        ¿Olvidaste tu contraseña?
                    </a>
                </form>
        </div>
        <!-- End inputs-->
    </div>

    <!-- Js-files -->
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
